services:
  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    working_dir: /app
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - .:/app
    environment:
      - DOCKER=true
      - CHOKIDAR_USEPOLLING=1
    command: sh -c "npm ci && npm run dev"
